[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mil-baseline"
version = "0.1.0"
description = "MIL baseline for custom histology WSI (patch features + ABMIL / max-pool)"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
mil-extract = "mil_baseline.cli:main_extract"
mil-train-cv = "mil_baseline.cli:main_train_cv"
