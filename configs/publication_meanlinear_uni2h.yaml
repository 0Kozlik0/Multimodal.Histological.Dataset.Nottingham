# Publication-grade: MeanLinear MIL, UNI2-h (ViT-H/14) encoder, multi-seed CV.
# Same protocol as publication_meanlinear_resnet50.yaml — only features_dir/results_dir/encoder differ.
slides_dir: .mnt/nfs-data
labels_json: data/prepared_mil_dataset/labels_prepared.json
features_dir: data/features_uni2h_prepared
results_dir: results_pub_meanlinear_uni2h

num_classes: 3
class_names:
  - "Grade 1"
  - "Grade 2"
  - "Grade 3"

patch:
  level: 0
  size: 256
  stride: 256
  max_patches_per_slide: 8000

tissue:
  hsv_s_min: 0.05
  hsv_v_min: 0.08
  max_background_frac: 0.9

encoder:
  name: uni2_h
  hf_token: null
  checkpoint_path: null
  batch_size: 32

mil:
  model: mean_linear
  hidden_dim: 256
  attention_hidden: 128
  dropout: 0.0
  k_sample: 8
  augment:
    gaussian_noise_std: 0.0
    feature_dropout: 0.0
    patch_dropout: 0.0

clam:
  k_sample: 8
  instance_weight: 0.3

train:
  seed: null
  lr: 0.001
  weight_decay: 0.01
  epochs: 80
  patience: 100
  val_frac: 0.05
  early_stop_metric: fixed_epoch
  min_epochs: 80
  label_smoothing: 0.0
  class_weight: none
  max_class_weight: null
  ema_decay: 0.99
  eval_with_ema: false
  lr_scheduler: cosine
  tta_passes: 1

cv:
  n_splits: 5
  n_seeds: 3
  shuffle: true

wandb:
  project: nottingham-mil-benchmark
  entity: null
  group: encoder_benchmark_uni2h
  mode: null
