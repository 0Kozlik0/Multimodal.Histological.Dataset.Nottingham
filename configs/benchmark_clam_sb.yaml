# CLAM-SB benchmark run (Lu et al., 2021).
# Identical to baseline_prepared.yaml except mil.model = clam_sb and separate results_dir.
slides_dir: .mnt/nfs-data
labels_json: data/prepared_mil_dataset/labels_prepared.json
features_dir: data/features_prepared
results_dir: results_clam_sb

num_classes: 3
class_names:
  - "Grade 1"
  - "Grade 2"
  - "Grade 3"

patch:
  level: 0
  size: 256
  stride: 256
  max_patches_per_slide: 8000

tissue:
  hsv_s_min: 0.05
  hsv_v_min: 0.08
  max_background_frac: 0.9

encoder:
  name: resnet50
  weights: IMAGENET1K_V2
  hf_token: null
  checkpoint_path: null
  conch_checkpoint: null
  batch_size: 64

mil:
  model: clam_sb
  hidden_dim: 256
  attention_hidden: 128
  dropout: 0.25
  k_sample: 8
  augment:
    gaussian_noise_std: 0.0
    feature_dropout: 0.0
    patch_dropout: 0.0

clam:
  k_sample: 8
  instance_weight: 0.3

train:
  seed: null          # set to null to disable model-init seeding (fold splits stay reproducible)
  lr: 0.00015
  weight_decay: 0.00001
  epochs: 60
  patience: 20
  val_frac: 0.15
  early_stop_metric: balanced_acc   # balanced_acc | macro_f1 | macro_auc — robust on tiny val sets
  min_epochs: 10                    # warmup: early stopping only fires after this many epochs
  label_smoothing: 0.05             # reduces overconfidence on small dataset

cv:
  n_splits: 5
  n_seeds: 1
  shuffle: true

wandb:
  project: nottingham-mil-benchmark
  entity: null
  group: null
  mode: null
